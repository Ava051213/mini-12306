spring:
  application:
    name: mini-12306
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3307/mini_12306?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  flyway:
    # Enable migrations after database isolation is ready
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  sql:
    init:
      mode: never

logging:
  level:
    org.springframework.web: INFO
    org.springframework.web.servlet.PageNotFound: ERROR
